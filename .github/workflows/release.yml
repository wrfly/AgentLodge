# Building and publishing the images.
#
#   push to master   →  :master
#   tag v1.2.3       →  :1.2.3 and :latest
#   pull request     →  built, never pushed
#
# The namespace is **the repository owner**, not a hard-coded `wrfly`. A fork publishes to
# its own account with no edits, which is the whole reason it is written this way — and a
# fork whose owner has not set the secrets still gets its images built, so a broken
# Dockerfile fails the pull request rather than somebody's release six weeks later.
name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (linux/arm64 goes through QEMU and is slow)'
        default: linux/amd64
        type: string

permissions:
  contents: read

jobs:
  # Publishing an image nobody checked is worse than publishing none: it looks like a
  # release. The tests are the gate, not a parallel job that goes red after the push.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: docker/server.Dockerfile
            context: .
          - name: web
            dockerfile: docker/web.Dockerfile
            context: .
          - name: agent
            dockerfile: docker/agent.Dockerfile
            context: .
          - name: audit-proxy
            dockerfile: docker/audit-proxy.Dockerfile
            context: .
          - name: credential-manager
            dockerfile: credential-manager/Dockerfile
            context: credential-manager
    steps:
      - uses: actions/checkout@v7

      # Docker Hub namespaces are lowercase; GitHub account names are not necessarily
      - id: ns
        run: echo "ns=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # A fork with no secrets set still builds — it just does not push. `secrets` is not
      # available in a job-level `if`, so the decision becomes a step output.
      - id: publish
        run: echo "push=${{ secrets.DOCKERHUB_TOKEN != '' && github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      # The pinned CLI versions live in the Dockerfile's ARG defaults and are read from
      # there. Repeating them here would mean two places to update and one of them being
      # wrong, and the whole point of the labels is that they can be trusted.
      - id: cli
        if: matrix.name == 'agent'
        run: |
          echo "claude=$(sed -n 's/^ARG CLAUDE_VERSION=//p' docker/agent.Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "codex=$(sed -n 's/^ARG CODEX_VERSION=//p' docker/agent.Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: contains(inputs.platforms, 'arm')
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.publish.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || steps.ns.outputs.ns }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagging:
      #   push to master  →  :master          the rolling build of the branch
      #   tag v1.2.3      →  :1.2.3 :latest
      #
      # No commit id in a tag. A tag per commit accumulates for ever, nobody deploys by SHA,
      # and the registry ends up with a thousand tags nobody can tell apart. The branch name
      # says what it is, and `git log` already says which commit built it — the image's
      # `revision` label carries the SHA for anyone who needs to check.
      #
      # `latest` follows the newest **release tag**, never master. It is the tag people
      # deploy without thinking about it, so it has to mean "the last version we cut", not
      # "whatever landed on master this afternoon".
      #
      # No floating `{{major}}.{{minor}}` tag either. It answers nothing that :latest and an
      # exact version do not already answer, and it looks pinned while quietly moving — the
      # same accident as :latest, minus the warning label. On 0.x it is worse still, since a
      # minor bump is allowed to break things.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ steps.ns.outputs.ns }}/agentlodge-${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'agent' && format('CLAUDE_VERSION={0}', steps.cli.outputs.claude) || '' }}
            ${{ matrix.name == 'agent' && format('CODEX_VERSION={0}', steps.cli.outputs.codex) || '' }}
            ${{ matrix.name == 'server' && 'CONTAINER_CLIENT=docker' || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Which CLI versions are inside is the first thing anybody asks when an agent
      # misbehaves, and a summary line answers it without pulling the image
      - if: matrix.name == 'agent'
        run: |
          {
            echo "### agent image"
            echo "- claude-code \`${{ steps.cli.outputs.claude }}\`"
            echo "- codex \`${{ steps.cli.outputs.codex }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
