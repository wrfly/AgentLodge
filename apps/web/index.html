<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>AgentLodge</title>
    <script>
      // Settle theme and language before the first paint, so neither flashes.
      // Kept in sync with lib/theme.ts and lib/i18n.ts — same storage keys,
      // same fallbacks. Duplicated on purpose: importing a module here would
      // cost a round trip and reintroduce the flash this exists to prevent.
      (function () {
        var t = localStorage.getItem('agentlodge-theme') || 'system';
        var dark =
          t === 'dark' ||
          (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);

        var locales = ['en', 'zh', 'ja', 'ru'];
        var saved = localStorage.getItem('agentlodge-locale');
        if (locales.indexOf(saved) < 0) {
          saved = 'en';
          var tags = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < tags.length; i++) {
            var base = String(tags[i]).toLowerCase().split('-')[0];
            if (locales.indexOf(base) >= 0) {
              saved = base;
              break;
            }
          }
        }
        document.documentElement.lang = saved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
