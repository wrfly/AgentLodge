name: authkey-sync

services:
  authkey-sync:
    build: .
    image: authkey-sync:latest
    restart: unless-stopped
    volumes:
      # Whatever you mount here is what gets parsed. Mount the *directory*, not
      # the file: credential writers replace the file by rename, and a
      # single-file bind mount pins the original inode, so the container would
      # never see an update.
      - ${CREDENTIALS_DIR:-./example}:/input:ro
      - agent-secrets:/data/secrets
    environment:
      # Hand the key to the uid the consumers run as, so a 0600 file is enough.
      AUTH_KEY_OWNER: "10001:10001"
      # Paths default to /input/.credentials.json and /data/secrets/auth.key;
      # override only if you want to mount somewhere else.
      # CREDENTIALS_FILE: /input/.credentials.json
      # AUTH_KEY_FILE: /data/secrets/auth.key
      # TOKEN_JSON_PATH: claudeAiOauth.accessToken
      # POLL_INTERVAL: 2s
      # AUTH_KEY_MODE: "0600"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH  # read the 0600 credentials file owned by the host user
      - CHOWN            # hand the written key to AUTH_KEY_OWNER
    security_opt:
      - no-new-privileges:true

  # Example consumer: same uid as AUTH_KEY_OWNER, so the 0600 key is readable.
  consumer:
    image: alpine:3.22
    depends_on:
      - authkey-sync
    user: "10001:10001"
    command:
      - sh
      - -c
      - 'while :; do echo "auth.key=$$(cat /data/secrets/auth.key 2>/dev/null || echo "<not ready>")"; sleep 10; done'
    volumes:
      - agent-secrets:/data/secrets:ro

volumes:
  agent-secrets:
