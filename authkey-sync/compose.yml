name: auther

services:
  auther:
    build: .
    image: auther:latest
    restart: unless-stopped
    volumes:
      # Credential directories, one per provider. Mount the *directory*, not the
      # file: `claude login` / `codex login` replace the file by rename, and a
      # single-file bind mount pins the old inode so the container never sees
      # the update. These are read-only — the auther holds the refresh token in
      # memory (and, optionally, encrypted at rest), it does not write the
      # source credential back.
      - ${CLAUDE_CREDENTIALS_DIR:-${HOME}/.claude}:/claude:ro
      - ${CODEX_CREDENTIALS_DIR:-${HOME}/.codex}:/codex:ro
      # The Unix socket the gateway connects to.
      - auther-run:/run/agentlodge
      # Optional file drop, for consumers that read a key from a file rather
      # than the socket (e.g. the AgentLodge app-gateway's key-file reader).
      - agent-secrets:/data/secrets
    environment:
      # Where the gateway finds the socket. Both sides need the same path.
      AUTHER_SOCKET: /run/agentlodge/auther.sock
      # Paths inside the container, matching the mounts above.
      CLAUDE_CREDENTIALS_FILE: /claude/.credentials.json
      CODEX_HOME: /codex
      # Optional file drop: publish the current access token here as a
      # single-line file, and hand it to the consumer's uid.
      AUTH_KEY_FILE: /data/secrets/auth.key
      AUTH_KEY_OWNER: "10001:10001"
      # ---- Refresh & persistence (see README.md) ----
      # REFRESH_LEAD_SECONDS: 60
      # HTTP_TIMEOUT: 30s
      # AUTHER_KEY: <32-byte key, hex/base64>   # encrypts AUTHER_STATE_FILE
      # AUTHER_STATE_FILE: /data/secrets/auther.state
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH  # read the host user's 0600 credential files
      - CHOWN            # hand the published key to AUTH_KEY_OWNER
    security_opt:
      - no-new-privileges:true

  # Example consumer of the socket: curls the auther over the UDS and prints the
  # access token, proving the gateway can reach it.
  consumer:
    image: alpine:3.22
    depends_on:
      - auther
    command:
      - sh
      - -c
      - 'while :; do echo "token=$(curl -s --unix-socket /run/agentlodge/auther.sock http://localhost/token?provider=claude)"; sleep 10; done'
    volumes:
      - auther-run:/run/agentlodge:ro
    user: "0:0"

volumes:
  auther-run:
  agent-secrets:
