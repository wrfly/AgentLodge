# Running AgentLodge from published images.
#
# Self-contained on purpose: this file plus a .env is the whole deployment. There is no
# repository to clone, nothing to build, and no second compose file to overlay — download
# these two and start.
#
#   curl -fsSLO https://raw.githubusercontent.com/wrfly/AgentLodge/master/docker/compose.release.yml
#   curl -fsSL  https://raw.githubusercontent.com/wrfly/AgentLodge/master/docker/env.release.example -o .env
#   $EDITOR .env                     # JWT_SECRET, AUDIT_ADMIN_TOKEN, DATA_DIR at minimum
#   sudo install -d -o 10001 -g 10001 "$DATA_DIR"
#   docker compose -f compose.release.yml up -d
#   docker pull docker.io/wrfly/agentlodge-agent:latest    # see AGENT_IMAGE below
#
# Written for **Docker**. On rootless podman, drop the `user:` and `group_add:` lines from
# app and gateway — there, root inside a container is already you on the host — and point
# PODMAN_SOCK at podman's socket.
#
# The design notes for every setting here are in docker/compose.yml in the repository, which
# is the build-from-source version of this same stack. Two things bear repeating because
# getting them wrong is quiet rather than loud:
#
#   * DATA_DIR must be an **absolute host path**, not a named volume. app creates the agent
#     containers through the mounted socket, and their `-v` source paths are resolved by the
#     engine *on the host*, where a named volume's /data does not exist.
#   * JWT_SECRET is fixed and secret. Whoever holds it can forge an administrator, and
#     changing it makes the encrypted system settings permanently unreadable. Upstream
#     credentials are not among them — those live in credential-manager, under its own key.

# AGENTLODGE_TAG picks the channel: `latest` is the newest release, `master` is the rolling
# build of the branch. `latest` exists only once a v* tag has been cut.
x-image-base: &image-base docker.io/${AGENTLODGE_NAMESPACE:-wrfly}/agentlodge
x-data-dir: &data-dir ${DATA_DIR:?must be an absolute path on the host, e.g. /srv/agentlodge/data}
x-audit-proxy-url: &audit-proxy-url ${AUDIT_PROXY_URL:-http://audit:8796}
x-audit-admin-token: &audit-admin-token ${AUDIT_ADMIN_TOKEN:?must be set, e.g. openssl rand -base64 32}

services:
  app:
    image: ${AGENTLODGE_NAMESPACE:-wrfly}/agentlodge-server:${AGENTLODGE_TAG:-latest}
    # Same uid the agent containers run as, so both sides can share one bind mount
    user: "10001:10001"
    group_add: ["${DOCKER_GID:?the host docker group gid, from getent group docker}"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?must be set, e.g. openssl rand -base64 48}
      ROLE: app
      # The deployment's clock. Everything time-bucketed is written in it: which day a
      # usage row lands on, and where the quota windows fall. Set it to the machine's own
      # zone — `cat /etc/timezone` — rather than leaving it at UTC, or a day boundary lands
      # in the middle of the afternoon. Mounting /etc/localtime is not the same thing: the
      # shell's `date` picks it up and Node does not (DESIGN.md §16).
      TZ: ${TZ:-UTC}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      DATA_DIR: /data
      USE_CONTAINERS: "true"
      AGENT_NETWORK: agentlodge-agent-net
      # Pulled by the engine on the host, not by compose — see the `docker pull` line above
      AGENT_IMAGE: ${AGENT_IMAGE:-docker.io/wrfly/agentlodge-agent:latest}
      GATEWAY_URL: http://gateway:8788
      GATEWAY_INTERNAL_URL: http://gateway:8788
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-${APP_BASE_URL:-http://localhost}}
      AUDIT_PROXY_URL: *audit-proxy-url
      AUDIT_ADMIN_TOKEN: *audit-admin-token
      HOST_DATA_DIR: *data-dir
      HOST: 0.0.0.0
      PODMAN_BIN: docker
      DOCKER_HOST: unix:///run/podman/podman.sock
    volumes:
      - type: bind
        source: *data-dir
        target: /data
        bind: { create_host_path: true }
      - ${PODMAN_SOCK:-/var/run/docker.sock}:/run/podman/podman.sock
    networks: [frontend, backend]
    depends_on: [gateway]
    security_opt: ["label=disable"]
    restart: unless-stopped

  gateway:
    image: ${AGENTLODGE_NAMESPACE:-wrfly}/agentlodge-server:${AGENTLODGE_TAG:-latest}
    user: "10001:10001"
    environment:
      JWT_SECRET: ${JWT_SECRET:?must be set, e.g. openssl rand -base64 48}
      ROLE: gateway
      # The deployment's clock. Everything time-bucketed is written in it: which day a
      # usage row lands on, and where the quota windows fall. Set it to the machine's own
      # zone — `cat /etc/timezone` — rather than leaving it at UTC, or a day boundary lands
      # in the middle of the afternoon. Mounting /etc/localtime is not the same thing: the
      # shell's `date` picks it up and Node does not (DESIGN.md §16).
      TZ: ${TZ:-UTC}
      DATA_DIR: /data
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8788"
      AUDIT_PROXY_URL: *audit-proxy-url
      MAX_UPSTREAM_CONCURRENCY: ${MAX_UPSTREAM_CONCURRENCY:-3}
      # Where upstream credentials live, when the credential-manager profile is running
      CREDENTIAL_MANAGER_SOCKET: /run/agentlodge/credential-manager.sock
    volumes:
      - type: bind
        source: *data-dir
        target: /data
        bind: { create_host_path: true }
      # The credential manager's socket. Empty unless that profile is running, which
      # mounts cleanly either way; read-only because connecting needs no write access.
      - type: bind
        source: ${CREDENTIAL_MANAGER_SOCKET_DIR:-/run/agentlodge}
        target: /run/agentlodge
        read_only: true
        bind: { create_host_path: true }
    networks: [agent-net, frontend, backend]
    depends_on: [audit]
    restart: unless-stopped

  audit:
    image: ${AGENTLODGE_NAMESPACE:-wrfly}/agentlodge-audit-proxy:${AGENTLODGE_TAG:-latest}
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "8796"
      TRACE_DIR: /traces
      PROXY_ADMIN_TOKEN: *audit-admin-token
      PROXY_DYNAMIC_UPSTREAM: "1"
      PROXY_UPSTREAM_ALLOW: ${AUDIT_ALLOW_HOSTS:-api.deepseek.com,api.anthropic.com}
      # Both must be 0. The proxy observes; it does not retry and it does not queue. See
      # docker/compose.yml for why neither is a tuning knob.
      PROXY_RETRY: "0"
      PROXY_MAX_CONCURRENT: "0"
      PROXY_UI_PREFIX: ${AUDIT_UI_PREFIX:-}
      TRACE_MAX_DAYS: ${AUDIT_MAX_DAYS:-30}
      TRACE_MAX_COUNT: ${AUDIT_MAX_COUNT:-100000}
      TRACE_MAX_MB: ${AUDIT_MAX_MB:-10240}
    volumes:
      - agentlodge-audit:/traces
    networks: [backend]
    restart: unless-stopped

  caddy:
    image: ${AGENTLODGE_NAMESPACE:-wrfly}/agentlodge-web:${AGENTLODGE_TAG:-latest}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Where the bare address sends someone. The default is the project page; /claude
      # opens the application directly, which is what a deployment with no public face wants.
      LANDING_PATH: ${LANDING_PATH:-/landing/}
    volumes:
      - caddy-data:/data
    networks: [frontend]
    depends_on: [app]
    restart: unless-stopped

  # Holds every upstream credential — pasted keys, key files something else rotates, and
  # subscription refresh tokens — and hands the gateway a short-lived access token per
  # request. Nothing else in the deployment stores one, so this service is not optional.
  credential-manager:
    image: ${AGENTLODGE_NAMESPACE:-wrfly}/agentlodge-credential-manager:${AGENTLODGE_TAG:-latest}
    volumes:
      # The directory, never the file: a credentials file is replaced by rename, and a
      # single-file bind mount pins the old inode for good
      - ${CLAUDE_CREDENTIALS_DIR:-${HOME}/.claude}:/input:ro
      - ${CODEX_CREDENTIALS_DIR:-${HOME}/.codex}:/input-codex:ro
      # Key files that something else writes and rotates — a docker secret, a
      # secret-manager sidecar, another container. Read-only: this service reads them and
      # never writes back.
      - type: bind
        source: *data-dir
        target: /data
        read_only: true
        bind: { create_host_path: true }
      - type: bind
        source: ${CREDENTIAL_MANAGER_SOCKET_DIR:-/run/agentlodge}
        target: /run/agentlodge
        bind: { create_host_path: true }
      - agentlodge-credentials:/state
    environment:
      CLAUDE_CREDENTIALS_FILE: /input/.credentials.json
      CODEX_HOME: /input-codex
      # Directories a key file may be read from, colon-separated like PATH. The data
      # directory's secrets/ is here because that is where a key file usually goes; add a
      # mount point and name it here to use another.
      CREDENTIAL_FILE_ROOTS: /data/secrets:/run/secrets
      CREDENTIAL_MANAGER_SOCKET: /run/agentlodge/credential-manager.sock
      # The uid the gateway runs as, so it and nothing else can dial the socket
      CREDENTIAL_MANAGER_SOCKET_OWNER: "10001:10001"
      # The store is AES-256-GCM encrypted; set CREDENTIAL_MANAGER_KEY in .env to hold the
      # key outside the volume the ciphertext lives in
      CREDENTIAL_MANAGER_STATE_FILE: /state/credentials.enc
      CREDENTIAL_MANAGER_KEY: ${CREDENTIAL_MANAGER_KEY:-}
      CREDENTIAL_MANAGER_KEY_SEED: /state/store.key
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, CHOWN]
    security_opt: ["no-new-privileges:true"]
    # Outbound only: the token endpoints it mints against. It listens on no port — the Unix
    # socket is the only way in.
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:
  agent-net:
    # Named explicitly: app passes AGENT_NETWORK to `docker run --network` verbatim, and
    # compose's project prefix would stop the two matching
    name: agentlodge-agent-net
    # Reachable from the internet, deliberately — an agent has to be able to install packages
    # and look things up. Add `internal: true` for a version that cannot.
    #
    # ⚠️ On a cloud host, block 169.254.169.254 in the host firewall, or an agent can read
    #    the instance credentials the provider hands out.

volumes:
  # Every user's complete prompts. Back it up and control access to it accordingly.
  agentlodge-audit:
  agentlodge-credentials:
  caddy-data:
